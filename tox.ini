[tox]
envlist = lint,bats
# nothing to build or install: reproseed is a single shell script
no_package = True
minversion = 4.0

[testenv:lint]
deps =
    pre-commit
commands =
    pre-commit run --all-files --show-diff-on-failure

# bats is not pip-installable, so it must be installed on the system,
# e.g. "apt install bats" or "brew install bats-core".
# Arguments after "--" are passed to bats, e.g. "tox -e bats -- -f seed".
[testenv:bats]
allowlist_externals =
    sh
commands =
    sh -c 'exec bats "$@" tests/test_*.sh' bats {posargs}
